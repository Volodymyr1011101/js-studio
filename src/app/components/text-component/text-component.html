<ng-container [ngTemplateOutlet]="regular"></ng-container>

<ng-template #regular>
  <div class="max-w-[1920px] w-[90%] text-[19px] text-block relative py-2 mb-8 font-[500] text" #scrollContainer>
    @for (p of textTranslateKeysArray; track p; let i = $index) {
      <p class="mb-2 scroll-anim">
        {{p | translate}}
      </p>
    }
    @for (p of additionalText; track p;) {
      <p class="scroll-anim additional-text">
        {{p | translate}}
        @if (studioName) {
          <span class="studio-name">{{studioName}}</span>
        }
      </p>
    }
  </div>
</ng-template>
